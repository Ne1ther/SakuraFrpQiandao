name: SakuraFrp 自动签到
run-name: SakuraFrp · ${{ github.event_name }} · ${{ github.event.schedule || 'manual' }}

on:
  # 每天北京时间 00:17 签到，08:43 补跑；错开整点调度高峰。
  # 脚本检测到今日已签到时直接结束，不会再次领取。
  schedule:
    - cron: '17 16 * * *'
    - cron: '43 0 * * *'
    # 临时调度探针：只检查 schedule 事件，不登录、不调用模型，验证后移除。
    - cron: '*/5 13-14 26 10 *'
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      verify_model:
        description: '额外验证视觉 API（使用智谱官方示例图片）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sakurafrp-checkin
  cancel-in-progress: false
  
jobs:
  schedule-probe:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 13-14 26 10 *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 验证定时调度
        run: echo 'GitHub schedule 事件已正常触发' >> "$GITHUB_STEP_SUMMARY"

  checkin:
    if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-14 26 10 *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 记录触发来源
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo "### SakuraFrp 签到"
            echo "- 触发方式：$TRIGGER_EVENT"
            echo "- 定时表达式：${TRIGGER_SCHEDULE:-manual}"
            echo "- 开始时间：$(TZ=Asia/Shanghai date '+%F %T %Z')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps chromium

      - name: 验证视觉 API
        if: github.event_name == 'workflow_dispatch' && inputs.verify_model
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI
          def setting(name):
              return os.environ[name].split('\n')[0].strip()
          client = OpenAI(
              base_url=setting('BASE_URL'),
              api_key=setting('API_KEY'),
              timeout=60,
              max_retries=1,
          )
          reply = client.chat.completions.create(
              model=setting('MODEL'),
              messages=[{'role': 'user', 'content': [
                  {'type': 'text', 'text': '请简短描述这张图片中的内容。'},
                  {'type': 'image_url', 'image_url': {
                      'url': 'https://cdn.bigmodel.cn/static/logo/api-key.png'
                  }},
              ]}],
          )
          if not reply.choices or not (reply.choices[0].message.content or '').strip():
              raise RuntimeError('视觉 API 没有返回有效文本')
          print('视觉 API 调用成功')
          PY
      
      - name: 运行签到脚本
        env:
          SAKURAFRP_USER: ${{ secrets.SAKURAFRP_USER }}
          SAKURAFRP_PASS: ${{ secrets.SAKURAFRP_PASS }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
          IMAGE_AS_BASE64: ${{ secrets.IMAGE_AS_BASE64 || 'false' }}
          CI: 'true'
          HEADLESS: 'true'
        run: |
          python main.py
          # 上游部分失败路径仍会以 0 退出，必须同时检查成功标记。
          if ! grep -Fq '✓ 签到流程完成' checkin.log; then
            echo '::error::未确认签到成功，请查看上方签到日志。'
            exit 1
          fi
      
      - name: 发送邮件通知
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL || secrets.EMAIL_USERNAME }}
        run: |
          python send_email.py
      
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs
          path: checkin.log
          retention-days: 7
